[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipvoice"
version = "1.0.0"
description = "复刻原声换口型流水线：给一段口播底片视频和新文案，产出本人形象+本人声音+说新台词的成片"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LipVoice contributors" }]
keywords = ["lip-sync", "voice-clone", "digital-human", "video", "tts", "换口型", "声音复刻"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/OWNER/lipvoice"
Issues = "https://github.com/OWNER/lipvoice/issues"

[project.scripts]
lipvoice = "lipvoice:main"

[tool.setuptools]
py-modules = ["lipvoice"]

[tool.setuptools.package-data]
"*" = ["SKILL.md", "AGENTS.md", "DISCLAIMER.md", "config.example.json"]
